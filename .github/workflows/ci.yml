name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      # Builds apps/site (which runs verify-build.mjs: internal links, canonicals,
      # JSON-LD, single-h1) and apps/worker (which runs embed-site.mjs: refuses an
      # index.html that would overwrite the SPA shell).
      - name: Build
        run: bun run build

  # The Worker deploys from deploy.yml on every push to deploy/feedback, not
  # here; `bun run deploy:mcp` (npm) stays local.
